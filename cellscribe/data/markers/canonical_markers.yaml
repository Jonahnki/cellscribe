# Cellscribe canonical marker reference (human + mouse)
#
# Provenance and licensing
# ------------------------
# This list was compiled by hand from canonical, textbook-level marker genes
# that are established in the primary literature and in public cell atlases
# (e.g. Tabula Sapiens, Tabula Muris, Human Protein Atlas single-cell type
# annotations, and tissue-specific atlas papers). Each entry is a short list of
# well-known marker genes, i.e. factual statements about gene expression, and
# is NOT an export or copy of any third-party database.
#
# We deliberately do NOT bundle larger community databases such as PanglaoDB
# or CellMarker, because their redistribution terms are not clearly stated.
# Users who want those references can download them under the providers'
# terms and pass them via `annotation.marker_file` (YAML in this format, or a
# two/three-column CSV: cell_type,gene[,species]).
#
# This file is released under the same MIT license as Cellscribe.
#
# Schema
# ------
#   name:    display name of the cell type or state
#   lineage: broad group; used as the fallback label when several subtypes of
#            one lineage fit a cluster about equally well
#   kind:    "cell_type" (default) or "state" (e.g. proliferation). States are
#            reported alongside the cell-type call rather than replacing it.
#   generic: true for catch-all entries that should only win when no more
#            specific entry of the same lineage fits
#   human / mouse: marker gene symbols (HGNC / MGI). Aliases may be listed;
#            only genes present in the dataset are used for scoring.

